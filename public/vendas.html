<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendas — Frutas</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="side"></div>
  <div class="main">
    <div class="topbar">
      <h1>Vendas</h1>
      <div class="sub">Saídas das 5 frutas (AK + JRF) por data de movimento · quantidade e valor</div>
    </div>
    <div class="controls">
      <label class="dtlbl">De <input id="dtIni" class="sel" type="date" /></label>
      <label class="dtlbl">Até <input id="dtFim" class="sel" type="date" /></label>
      <button id="aplicar" class="sel btn-aplicar" type="button">Aplicar</button>
      <span class="badge-modo" id="modo"></span>
    </div>
    <div class="content">
      <div class="segbar" id="abas" role="tablist">
        <button data-g="entregas" class="on" role="tab" type="button">Entregas</button>
        <button data-g="ceasa" role="tab" type="button">Ceasa</button>
      </div>

      <div class="kpis kpis-3" id="kpis"></div>

      <div class="panel">
        <div class="phead">
          <div class="ttl">Curva de vendas <span class="muted" id="chartSub"></span></div>
          <div class="chart-leg">
            <span class="lg lg-vlr">● Valor (R$)</span>
            <span class="lg lg-qt">● Quantidade (kg)</span>
          </div>
        </div>
        <div class="chart-wrap" id="chartWrap"></div>
      </div>

      <div class="panel">
        <div class="phead"><div class="ttl">Por dia <span class="muted" id="tblSub"></span></div></div>
        <table>
          <thead><tr>
            <th>DIA</th><th class="num">QTD (kg)</th><th class="num">VALOR</th>
            <th class="num">PEDIDOS</th><th class="num">TICKET MÉDIO/kg</th>
          </tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/vendas.js"></script>
</body>
</html>
