<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nordestão — Adiantamentos</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="side"></div>
  <div class="main">
    <div class="topbar">
      <h1>Nordestão</h1>
      <div class="sub">Adiantamentos — contas a receber por data de emissão · clique num título para ver os itens</div>
    </div>
    <div class="controls">
      <label class="dtlbl">De <input id="dtIni" class="sel" type="date" /></label>
      <label class="dtlbl">Até <input id="dtFim" class="sel" type="date" /></label>
      <button id="aplicar" class="sel btn-aplicar" type="button">Aplicar</button>
      <select id="lojaSel" class="sel"><option value="TODAS">Todas as lojas</option></select>
      <input id="busca" class="busca" type="search" placeholder="Buscar loja ou nº da nota…" />
      <span class="badge-modo" id="modo"></span>
      <span class="badge-modo" id="fonte" title="Arquivos de adiantamento lidos"></span>
    </div>
    <div class="content">
      <div class="panel upload-panel">
        <div class="phead">
          <div class="ttl">Arquivos de adiantamento <span class="muted" id="upCont"></span></div>
          <div class="up-actions">
            <input id="upFile" type="file" accept=".xlsx,.XLSX" multiple hidden />
            <button id="upBtn" class="sel btn-aplicar" type="button">Enviar .xlsx</button>
          </div>
        </div>
        <div id="upStatus" class="up-status"></div>
        <div id="upList" class="up-list"></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="panel">
        <div class="phead">
          <div class="ttl">Títulos <span class="muted" id="cont"></span></div>
          <div><span class="filtro-ativo" id="filtro"></span><span class="limpar" id="limpar" style="display:none">limpar filtro</span></div>
        </div>
        <table>
          <thead><tr>
            <th>LOJA</th><th>NOTA</th><th>EMISSÃO</th><th>VENCIMENTO</th>
            <th class="num">VALOR</th><th>STATUS</th><th class="num">RECEBIDO (est.)</th>
          </tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Drawer de detalhe do título -->
  <div id="drawer" class="drawer">
    <div class="drawer-bg" id="drawerBg"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div>
          <div class="drawer-ttl" id="dTitulo">Título</div>
          <div class="muted" id="dSub"></div>
        </div>
        <button class="drawer-x" id="drawerX">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/nordestao.js"></script>
</body>
</html>
