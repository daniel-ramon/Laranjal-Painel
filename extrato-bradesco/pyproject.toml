[project]
name = "extrato-bradesco"
version = "0.1.0"
description = "Consulta diaria do extrato de conta corrente no Bradesco, geracao de PDF e envio automatico"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
extrato = "extrato.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extrato = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
